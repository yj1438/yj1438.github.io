<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Pelican riding a bicycle (animated)</title>
  <desc id="d">An animated flat-style illustration of a cheerful pelican wearing a red helmet, pedaling an orange bicycle: spinning wheels, cranking pedals with legs tracking them, bobbing frame, scrolling ground, drifting clouds and speed lines.</desc>

  <!-- Sky -->
  <rect width="800" height="600" fill="#EAF4F9"/>

  <!-- Sun -->
  <circle cx="688" cy="96" r="58" fill="#FFE9A8" opacity="0.55">
    <animate attributeName="r" values="58;63;58" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="688" cy="96" r="40" fill="#FFD66B"/>
  <g stroke="#FFD66B" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 688 96" to="360 688 96" dur="60s" repeatCount="indefinite"/>
    <line x1="736" y1="96" x2="746" y2="96"/>
    <line x1="721.9" y1="129.9" x2="729" y2="137"/>
    <line x1="688" y1="144" x2="688" y2="154"/>
    <line x1="654.1" y1="129.9" x2="647" y2="137"/>
    <line x1="640" y1="96" x2="630" y2="96"/>
    <line x1="654.1" y1="62.1" x2="647" y2="55"/>
    <line x1="688" y1="48" x2="688" y2="38"/>
    <line x1="721.9" y1="62.1" x2="729" y2="55"/>
  </g>

  <!-- Clouds drifting -->
  <g fill="#FFFFFF" opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0; 24 0; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="18s" repeatCount="indefinite"/>
    <ellipse cx="140" cy="102" rx="34" ry="18"/>
    <ellipse cx="178" cy="90" rx="30" ry="16"/>
    <ellipse cx="210" cy="104" rx="26" ry="14"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; -20 0; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="26s" repeatCount="indefinite"/>
    <ellipse cx="468" cy="66" rx="28" ry="14"/>
    <ellipse cx="500" cy="58" rx="24" ry="12"/>
    <ellipse cx="528" cy="68" rx="20" ry="11"/>
  </g>

  <!-- Ground -->
  <rect y="525" width="800" height="75" fill="#D8E6C9"/>
  <line x1="0" y1="525" x2="800" y2="525" stroke="#B9CFA6" stroke-width="3"/>

  <!-- Scrolling grass tufts (250 px/s) -->
  <g stroke="#A9C48F" stroke-width="3" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="0.96s" repeatCount="indefinite"/>
    <path d="M -120 524 q 3 -12 6 0 M -110 524 q 4 -16 8 0 M -100 524 q 3 -10 6 0"/>
    <path d="M 120 524 q 3 -12 6 0 M 130 524 q 4 -16 8 0 M 140 524 q 3 -10 6 0"/>
    <path d="M 360 524 q 3 -12 6 0 M 370 524 q 4 -16 8 0 M 380 524 q 3 -10 6 0"/>
    <path d="M 600 524 q 3 -12 6 0 M 610 524 q 4 -16 8 0 M 620 524 q 3 -10 6 0"/>
    <path d="M 840 524 q 3 -12 6 0 M 850 524 q 4 -16 8 0 M 860 524 q 3 -10 6 0"/>
  </g>

  <!-- Scrolling road dashes (250 px/s) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.4s" repeatCount="indefinite"/>
    <line x1="-140" y1="548" x2="940" y2="548" stroke="#BCCFA8" stroke-width="4" stroke-dasharray="34 66"/>
  </g>

  <!-- Speed lines pulsing -->
  <g stroke="#B7C9DA" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.25;0.85;0.25" dur="0.8s" repeatCount="indefinite"/>
    <line x1="58" y1="378" x2="128" y2="378"/>
    <line x1="28" y1="428" x2="112" y2="428"/>
    <line x1="66" y1="478" x2="136" y2="478"/>
  </g>

  <!-- Shadow (pulses with the bob) -->
  <ellipse cx="400" cy="530" rx="240" ry="11" fill="#3B5B43" opacity="0.13">
    <animate attributeName="rx" values="240;231;240" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.13;0.16;0.13" dur="0.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================= RIDER (bobs gently) ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="0.6s" repeatCount="indefinite"/>

    <!-- Rear wheel -->
    <circle cx="240" cy="450" r="75" fill="none" stroke="#2F3542" stroke-width="13"/>
    <circle cx="240" cy="450" r="60" fill="none" stroke="#9FB4C7" stroke-width="3"/>
    <g stroke="#B7C7D6" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0 240 450" to="360 240 450" dur="1.5s" repeatCount="indefinite"/>
      <line x1="240" y1="392" x2="240" y2="508"/>
      <line x1="240" y1="392" x2="240" y2="508" transform="rotate(30 240 450)"/>
      <line x1="240" y1="392" x2="240" y2="508" transform="rotate(60 240 450)"/>
      <line x1="240" y1="392" x2="240" y2="508" transform="rotate(90 240 450)"/>
      <line x1="240" y1="392" x2="240" y2="508" transform="rotate(120 240 450)"/>
      <line x1="240" y1="392" x2="240" y2="508" transform="rotate(150 240 450)"/>
    </g>
    <circle cx="240" cy="450" r="9" fill="#2F3542"/>

    <!-- Front wheel -->
    <circle cx="560" cy="450" r="75" fill="none" stroke="#2F3542" stroke-width="13"/>
    <circle cx="560" cy="450" r="60" fill="none" stroke="#9FB4C7" stroke-width="3"/>
    <g stroke="#B7C7D6" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0 560 450" to="360 560 450" dur="1.5s" repeatCount="indefinite"/>
      <line x1="560" y1="392" x2="560" y2="508"/>
      <line x1="560" y1="392" x2="560" y2="508" transform="rotate(30 560 450)"/>
      <line x1="560" y1="392" x2="560" y2="508" transform="rotate(60 560 450)"/>
      <line x1="560" y1="392" x2="560" y2="508" transform="rotate(90 560 450)"/>
      <line x1="560" y1="392" x2="560" y2="508" transform="rotate(120 560 450)"/>
      <line x1="560" y1="392" x2="560" y2="508" transform="rotate(150 560 450)"/>
    </g>
    <circle cx="560" cy="450" r="9" fill="#2F3542"/>

    <!-- Far leg pedaling (phase +180 deg vs near leg) -->
    <path d="M 344 280 L 362 352 L 369.5 421.5" fill="none" stroke="#D18A2B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
        M 344 280 L 362 352 L 369.5 421.5;
        M 344 280 L 366 358 L 395 411;
        M 344 280 L 370 352 L 420.5 421.5;
        M 344 280 L 378 346 L 431 447;
        M 344 280 L 376 352 L 420.5 472.5;
        M 344 280 L 368 362 L 395 483;
        M 344 280 L 360 352 L 369.5 472.5;
        M 344 280 L 352 346 L 359 447;
        M 344 280 L 362 352 L 369.5 421.5"/>
    </path>
    <polygon points="369.5,421.5 388.5,428.5 370.5,433.5 351.5,428.5" fill="#D18A2B">
      <animate attributeName="points" dur="3s" repeatCount="indefinite" values="
        369.5,421.5 388.5,428.5 370.5,433.5 351.5,428.5;
        395,411 414,418 396,423 377,418;
        420.5,421.5 439.5,428.5 421.5,433.5 402.5,428.5;
        431,447 450,454 432,459 413,454;
        420.5,472.5 439.5,479.5 421.5,484.5 402.5,479.5;
        395,483 414,490 396,495 377,490;
        369.5,472.5 388.5,479.5 370.5,484.5 351.5,479.5;
        359,447 378,454 360,459 341,454;
        369.5,421.5 388.5,428.5 370.5,433.5 351.5,428.5"/>
    </polygon>

    <!-- Far crank + pedal (rotates, pedal stays level) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 395 455" to="360 395 455" dur="3s" repeatCount="indefinite"/>
      <line x1="395" y1="455" x2="369.5" y2="429.5" stroke="#7A8494" stroke-width="7" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 369.5 429.5" to="-360 369.5 429.5" dur="3s" repeatCount="indefinite"/>
        <rect x="351.5" y="424" width="36" height="11" rx="3" fill="#7A8494"/>
      </g>
    </g>

    <!-- Frame -->
    <g stroke="#E76F51" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M 240 450 L 395 455 L 355 330 Z"/>
      <path d="M 395 455 L 548 362"/>
      <path d="M 355 330 L 540 330"/>
      <path d="M 540 330 L 556 368 L 560 450"/>
    </g>

    <!-- Drivetrain -->
    <line x1="247" y1="444" x2="391" y2="439" stroke="#57606F" stroke-width="3.5" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="247" y1="456" x2="398" y2="471" stroke="#57606F" stroke-width="3.5" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" from="0" to="12" dur="0.3s" repeatCount="indefinite"/>
    </line>
    <circle cx="395" cy="455" r="17" fill="none" stroke="#57606F" stroke-width="5"/>

    <!-- Near crank + pedal (rotates, pedal stays level) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 395 455" to="360 395 455" dur="3s" repeatCount="indefinite"/>
      <line x1="395" y1="455" x2="420.5" y2="480.5" stroke="#414956" stroke-width="7" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 420.5 480.5" to="-360 420.5 480.5" dur="3s" repeatCount="indefinite"/>
        <rect x="401.5" y="475" width="38" height="11" rx="3" fill="#2F3542"/>
      </g>
    </g>

    <!-- Seat post + saddle -->
    <line x1="355" y1="330" x2="349" y2="306" stroke="#414956" stroke-width="7"/>
    <path d="M 314 302 Q 348 286 384 298 Q 350 312 314 302 Z" fill="#2F3542"/>

    <!-- Stem + handlebar -->
    <line x1="540" y1="330" x2="534" y2="304" stroke="#414956" stroke-width="7"/>
    <path d="M 534 304 C 522 292 500 296 492 310" fill="none" stroke="#414956" stroke-width="8" stroke-linecap="round"/>
    <circle cx="492" cy="310" r="5.5" fill="#2F3542"/>

    <!-- Pelican: fluttering tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 260 250; -5 260 250; 0 260 250; 3 260 250; 0 260 250" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="2s" repeatCount="indefinite"/>
      <path d="M 262 236 L 206 214 L 240 244 L 200 248 L 238 264 L 208 284 L 260 268 Z" fill="#EFE8D9" stroke="#E3DAC8" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Neck -->
    <path d="M 386 208 C 414 192 426 168 426 144 C 426 124 434 112 452 108" fill="none" stroke="#E3DAC8" stroke-width="30" stroke-linecap="round"/>
    <path d="M 386 208 C 414 192 426 168 426 144 C 426 124 434 112 452 108" fill="none" stroke="#F8F4EB" stroke-width="24" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="335" cy="232" rx="90" ry="62" transform="rotate(-12 335 232)" fill="#F8F4EB" stroke="#E3DAC8" stroke-width="3"/>

    <!-- Head (gentle nod) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 452 108; 2.4 452 108; 0 452 108; -2.4 452 108; 0 452 108" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="3.4s" repeatCount="indefinite"/>
      <circle cx="458" cy="105" r="23" fill="#F8F4EB" stroke="#E3DAC8" stroke-width="3"/>
      <path d="M 433 100 A 25 25 0 0 1 483 100 L 483 103 L 433 103 Z" fill="#E63946"/>
      <line x1="429" y1="101" x2="487" y2="101" stroke="#C1121F" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="461" cy="110" rx="4" ry="4" fill="#2F3542">
        <animate attributeName="ry" values="4;4;0.4;4;4" keyTimes="0;0.9;0.94;0.98;1" dur="4.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="462.5" cy="108.5" r="1.4" fill="#FFFFFF">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.94;0.98;1" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M 474 102 C 510 98 548 106 572 124 C 574 127 572 130 569 129 C 540 122 507 116 474 116 Z" fill="#F2A649" stroke="#D98A2B" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 474 116 C 507 116 538 122 566 130 C 558 150 530 162 504 156 C 486 151 474 134 474 116 Z" fill="#F8C471" stroke="#D98A2B" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Wing reaching the handlebar (subtle press) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 366 214; -1.6 366 214; 0 366 214" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3.4s" repeatCount="indefinite"/>
      <path d="M 356 200 C 420 208 468 248 496 298 C 500 306 492 314 484 308 C 452 272 408 246 352 240 C 336 238 338 206 356 200 Z" fill="#F1EBDD" stroke="#E3DAC8" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 380 218 C 420 228 452 252 474 282" fill="none" stroke="#E3DAC8" stroke-width="3" stroke-linecap="round"/>
      <path d="M 372 232 C 408 242 436 262 456 288" fill="none" stroke="#E3DAC8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Near leg pedaling -->
    <path d="M 362 290 L 404 368 L 420.5 472.5" fill="none" stroke="#F2A649" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
        M 362 290 L 404 368 L 420.5 472.5;
        M 362 290 L 398 374 L 395 483;
        M 362 290 L 392 368 L 369.5 472.5;
        M 362 290 L 392 358 L 359 447;
        M 362 290 L 398 344 L 369.5 421.5;
        M 362 290 L 408 330 L 395 411;
        M 362 290 L 418 330 L 420.5 421.5;
        M 362 290 L 420 345 L 431 447;
        M 362 290 L 404 368 L 420.5 472.5"/>
    </path>
    <polygon points="420.5,472.5 440.5,481.5 422.5,487.5 402.5,482.5" fill="#F2A649" stroke="#D98A2B" stroke-width="2" stroke-linejoin="round">
      <animate attributeName="points" dur="3s" repeatCount="indefinite" values="
        420.5,472.5 440.5,481.5 422.5,487.5 402.5,482.5;
        395,483 415,492 397,498 377,493;
        369.5,472.5 389.5,481.5 371.5,487.5 351.5,482.5;
        359,447 379,456 361,462 341,457;
        369.5,421.5 389.5,430.5 371.5,436.5 351.5,431.5;
        395,411 415,420 397,426 377,421;
        420.5,421.5 440.5,430.5 422.5,436.5 402.5,431.5;
        431,447 451,456 433,462 413,457;
        420.5,472.5 440.5,481.5 422.5,487.5 402.5,482.5"/>
    </polygon>
  </g>
</svg>
