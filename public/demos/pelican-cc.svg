<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican riding a bicycle (animated)</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect y="474" width="800" height="126" fill="#a9d98f"/>
  <rect y="470" width="800" height="8" rx="4" fill="#8cc470"/>

  <!-- clouds drifting left (duplicated +800 for seamless loop) -->
  <g fill="#ffffff" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="9s" repeatCount="indefinite"/>
    <ellipse cx="120" cy="95" rx="46" ry="20"/>
    <ellipse cx="160" cy="82" rx="34" ry="16"/>
    <ellipse cx="640" cy="60" rx="52" ry="20"/>
    <ellipse cx="688" cy="48" rx="30" ry="14"/>
    <ellipse cx="920" cy="95" rx="46" ry="20"/>
    <ellipse cx="960" cy="82" rx="34" ry="16"/>
    <ellipse cx="1440" cy="60" rx="52" ry="20"/>
    <ellipse cx="1488" cy="48" rx="30" ry="14"/>
  </g>

  <!-- wind streaks flowing left -->
  <g stroke="#7fa8cc" stroke-width="6" stroke-linecap="round" stroke-dasharray="34 36" opacity="0.55">
    <line x1="30" y1="260" x2="120" y2="260">
      <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="55" y1="310" x2="150" y2="310">
      <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.5s" begin="-0.17s" repeatCount="indefinite"/>
    </line>
    <line x1="25" y1="360" x2="105" y2="360">
      <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.5s" begin="-0.34s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- grass tufts scrolling left at wheel speed (240px period) -->
  <g stroke="#79b25c" stroke-width="4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="0.66s" repeatCount="indefinite"/>
    <path d="M -240 516 l 14 -8"/>
    <path d="M 0 516 l 14 -8"/>
    <path d="M 240 516 l 14 -8"/>
    <path d="M 480 516 l 14 -8"/>
    <path d="M 720 516 l 14 -8"/>
    <path d="M -120 548 l 14 -8"/>
    <path d="M 120 548 l 14 -8"/>
    <path d="M 360 548 l 14 -8"/>
    <path d="M 600 548 l 14 -8"/>
    <path d="M 840 548 l 14 -8"/>
  </g>

  <!-- shadows -->
  <ellipse cx="210" cy="484" rx="105" ry="11" fill="#3f6b34" opacity="0.25"/>
  <ellipse cx="566" cy="484" rx="105" ry="11" fill="#3f6b34" opacity="0.25"/>

  <!-- whole scene: gentle bounce -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" dur="0.8s" repeatCount="indefinite"/>

    <!-- far leg (pedaling morph, 8-phase keyframes) -->
    <path fill="none" stroke="#d97c1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M 358 218 L 399 290 L 418 354">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M 358 218 L 399 290 L 418 354;
                M 358 218 L 410 308 L 439.5 390.2;
                M 358 218 L 404.5 328.5 L 429 431;
                M 358 218 L 386 339 L 392.8 452.5;
                M 358 218 L 366 334 L 352 442;
                M 358 218 L 355 316 L 330.5 405.8;
                M 358 218 L 360.5 295.5 L 341 365;
                M 358 218 L 379 285 L 377.2 343.5;
                M 358 218 L 399 290 L 418 354"/>
    </path>

    <!-- far crank: rotates around bottom bracket, pedal counter-rotates to stay level -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 385 398" to="360 385 398" dur="1.6s" repeatCount="indefinite"/>
      <line x1="385" y1="398" x2="418" y2="354" stroke="#495057" stroke-width="7" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 418 353.5" to="-360 418 353.5" dur="1.6s" repeatCount="indefinite"/>
        <rect x="403" y="349" width="30" height="9" rx="3" fill="#212529"/>
        <path d="M 402 352 L 436 352 L 430 362 L 408 362 Z" fill="#d97c1a"/>
      </g>
    </g>

    <!-- wheels -->
    <g fill="none">
      <circle cx="210" cy="388" r="92" stroke="#2b2d42" stroke-width="13"/>
      <circle cx="210" cy="388" r="80" stroke="#ced4da" stroke-width="4"/>
      <circle cx="566" cy="388" r="92" stroke="#2b2d42" stroke-width="13"/>
      <circle cx="566" cy="388" r="80" stroke="#ced4da" stroke-width="4"/>
    </g>
    <g stroke="#adb5bd" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 210 388" to="360 210 388" dur="1.6s" repeatCount="indefinite"/>
      <line x1="132" y1="388" x2="288" y2="388"/>
      <line x1="155" y1="333" x2="265" y2="443"/>
      <line x1="210" y1="310" x2="210" y2="466"/>
      <line x1="265" y1="333" x2="155" y2="443"/>
    </g>
    <g stroke="#adb5bd" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 566 388" to="360 566 388" dur="1.6s" repeatCount="indefinite"/>
      <line x1="488" y1="388" x2="644" y2="388"/>
      <line x1="511" y1="333" x2="621" y2="443"/>
      <line x1="566" y1="310" x2="566" y2="466"/>
      <line x1="621" y1="333" x2="511" y2="443"/>
    </g>
    <circle cx="210" cy="388" r="11" fill="#495057"/>
    <circle cx="566" cy="388" r="11" fill="#495057"/>

    <!-- frame -->
    <g stroke="#e63946" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 385 398 L 540 296"/>
      <path d="M 320 252 L 524 258"/>
      <path d="M 385 398 L 320 250"/>
      <path d="M 210 388 L 332 286"/>
      <path d="M 210 388 L 385 398"/>
      <path d="M 524 252 L 543 302 L 566 388"/>
    </g>

    <!-- handlebar -->
    <path d="M 524 252 L 514 214 Q 511 201 527 199 L 546 203" fill="none" stroke="#343a40" stroke-width="8" stroke-linecap="round"/>
    <circle cx="543" cy="203" r="7" fill="#212529"/>

    <!-- saddle -->
    <line x1="320" y1="250" x2="317" y2="236" stroke="#343a40" stroke-width="8"/>
    <ellipse cx="316" cy="233" rx="36" ry="10" fill="#343a40"/>

    <!-- drivetrain: chain links crawl in the pedaling direction -->
    <circle cx="210" cy="388" r="12" fill="none" stroke="#343a40" stroke-width="4"/>
    <line x1="385" y1="368" x2="210" y2="376" stroke="#495057" stroke-width="3" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" from="0" to="8" dur="0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="385" y1="428" x2="210" y2="400" stroke="#495057" stroke-width="3" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" from="0" to="-8" dur="0.25s" repeatCount="indefinite"/>
    </line>
    <circle cx="385" cy="398" r="30" fill="none" stroke="#343a40" stroke-width="5"/>
    <circle cx="385" cy="398" r="7" fill="#343a40"/>

    <!-- pelican: gentle bob, antiphase with the frame bounce -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>

      <path d="M 252 148 L 198 126 L 220 158 L 182 164 L 222 186 L 252 188 Z" fill="#f8f9fa" stroke="#cfd4da" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="330" cy="175" rx="92" ry="62" fill="#f8f9fa" stroke="#cfd4da" stroke-width="3"/>
      <ellipse cx="338" cy="203" rx="66" ry="24" fill="#e9ecef"/>

      <path d="M 392 152 C 428 130 448 106 458 76" fill="none" stroke="#cfd4da" stroke-width="34" stroke-linecap="round"/>
      <path d="M 392 152 C 428 130 448 106 458 76" fill="none" stroke="#f8f9fa" stroke-width="27" stroke-linecap="round"/>

      <circle cx="468" cy="70" r="27" fill="#f8f9fa" stroke="#cfd4da" stroke-width="3"/>
      <path d="M 448 52 Q 436 38 424 40 Q 438 50 442 60 Z" fill="#e9ecef"/>

      <path d="M 490 80 C 516 134 578 128 620 92 C 572 112 524 102 490 97 Z" fill="#fb8b24" stroke="#e07b00" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 484 56 Q 566 60 624 88 Q 560 82 484 78 Z" fill="#ffb703" stroke="#e09f00" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="500" y1="63" x2="540" y2="68" stroke="#e09f00" stroke-width="2"/>

      <circle cx="476" cy="60" r="4.5" fill="#22333b"/>
      <circle cx="478" cy="58" r="1.5" fill="#ffffff"/>

      <path d="M 348 138 C 420 126 500 162 538 196 C 520 208 448 208 386 194 C 360 186 340 160 348 138 Z" fill="#e9ecef" stroke="#cfd4da" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 366 176 Q 420 196 480 200" fill="none" stroke="#ced4da" stroke-width="2.5"/>
      <path d="M 380 160 Q 440 182 505 194" fill="none" stroke="#ced4da" stroke-width="2.5"/>
    </g>

    <!-- near leg (pedaling morph, 8-phase keyframes) -->
    <path fill="none" stroke="#f8961e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="M 342 220 L 369 323 L 352 442">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M 342 220 L 369 323 L 352 442;
                M 342 220 L 358 305 L 330.5 405.8;
                M 342 220 L 364 284.5 L 341 365;
                M 342 220 L 382 274 L 377.2 343.5;
                M 342 220 L 402 279 L 418 354;
                M 342 220 L 413 297 L 439.5 390.2;
                M 342 220 L 408 317.5 L 429 431;
                M 342 220 L 389 328 L 392.8 452.5;
                M 342 220 L 369 323 L 352 442"/>
    </path>

    <!-- near crank: rotates around bottom bracket, pedal counter-rotates to stay level -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 385 398" to="360 385 398" dur="1.6s" repeatCount="indefinite"/>
      <line x1="385" y1="398" x2="352" y2="442" stroke="#212529" stroke-width="7" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 352 441.5" to="-360 352 441.5" dur="1.6s" repeatCount="indefinite"/>
        <rect x="337" y="437" width="30" height="9" rx="3" fill="#212529"/>
        <path d="M 335 440 L 371 440 L 365 451 L 341 451 Z" fill="#f8961e" stroke="#e07b00" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
